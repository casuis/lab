# ==========================================
# INTERFACE
# ==========================================

interface=eno1

# ==========================================
# DHCP - VLAN 10
# Réseau : 10.0.0.0/24
# ==========================================


dhcp-range=tag:SALLE1,10.0.0.1,10.0.0.50,255.255.255.0,12h
dhcp-option=SALLE1,3,10.0.0.254

# ==========================================
# DHCP - VLAN 20
# Réseau : 20.0.0.0/24
# ==========================================


dhcp-range=tag:SALLE2,20.0.0.1,20.0.0.50,255.255.255.0,12h
dhcp-option=SALLE2,3,20.0.0.254

# ==========================================
# DNS
# ==========================================

dhcp-option=6,30.0.0.250
server=8.8.8.8

# ==========================================
# JOURNALISATION
# ==========================================

log-dhcp